[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boondmanager-client"
version = "0.0.2"
description = "Async Python client for the BoondManager API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Lenstra", email = "tech@lenstra.co" },
]
keywords = ["boondmanager", "api", "client", "erp", "timesheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Lenstra/boond-manager-client-python"
Repository = "https://github.com/Lenstra/boond-manager-client-python"
Issues = "https://github.com/Lenstra/boond-manager-client-python"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",  # scripts/fetch_spec.py
]

[tool.hatch.build.targets.wheel]
packages = ["boondmanager"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", "scripts", "dist"]
